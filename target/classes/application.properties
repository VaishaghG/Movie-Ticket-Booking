# Server Configuration
server.port=8080

# Application Name
spring.application.name=Movie Ticket Booking System

# MySQL Database Configuration (Environment variable overrides with local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_ticket_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vaish@mysql04}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Initialization
spring.sql.init.mode=never

# Server-Side Session Tracking Configuration (HttpSession)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Logging
logging.level.com.movieticketbooking=INFO
logging.level.org.springframework.jdbc=INFO
